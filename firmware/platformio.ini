[platformio]
default_envs = esp32s3_neckband

[env:esp32s3_neckband]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    esp32-camera
